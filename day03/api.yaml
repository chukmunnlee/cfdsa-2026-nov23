---
apiVersion: v1
kind: Namespace
metadata:
  name: day03

--- 
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: api-deploy
  namespace: day03
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
      env: dev
  template:
    metadata:
      labels:
        app: api
        env: dev
    spec:
      containers:
      - name: api-container 
        image: chukmunnlee/fake-api:v1-aug2026
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-port
          containerPort: 3000 
        - name: metric-port
          containerPort: 9464
        resources: {}

--- 
apiVersion: v1 
kind: Service
metadata:
  name: api-svc
  namespace: day03
spec:
  #type: ClusterIP
  #type: NodePort
  type: LoadBalancer
  selector:
    app: api
    env: dev
  ports:
  - port: 3000
    targetPort: http-port
