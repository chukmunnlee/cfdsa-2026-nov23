---
apiVersion: v1
kind: Namespace
metadata:
  name: day03

--- 
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: api-deploy
  namespace: day03
spec:
  replicas: 3
  strategy:
    type: Recreate
    #type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 20%
    #   maxUnavailable: 0
  selector:
    matchLabels:
      app: api
      env: dev
      version: v1
  template:
    metadata:
      labels:
        app: api
        env: dev
        version: v1
    spec:
      containers:
      - name: api-container 
        image: chukmunnlee/fake-api:v1-aug2026
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-port
          containerPort: 3000 
        - name: metric-port
          containerPort: 9464
        resources: {}

--- 
apiVersion: v1 
kind: Service
metadata:
  name: api-svc
  namespace: day03
spec:
  type: ClusterIP
  #type: NodePort
  #type: LoadBalancer
  selector:
    app: api
    env: dev
    version: v1
  ports:
  - port: 3000
    targetPort: http-port

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute 
metadata:
  name: api-httproute 
  namespace: day03
spec:
  hostnames:
  - api.172.25.39.200.nip.io
  parentRefs:
  - name: default-gtw 
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix 
        value: /
    backendRefs:
    - name: api-svc 
      namespace: day03 
      port: 3000
      weight: 3
    - name: api2-svc 
      namespace: day03 
      port: 3000
      weight: 1
