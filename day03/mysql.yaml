--- 
apiVersion: v1 
kind: Namespace
metadata: 
  name: day03

---
apiVersion: v1 
kind: Secret 
metadata: 
  name: mysql-secret 
  namespace: day03
data:
  # this is my api key
  api_key: dGhpcyBpcyBteSBhcGkga2V5

---
apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: mysql-cm 
  namespace: day03
data:
  README.txt: |
    this is a readme file

  myconfig: |
    127.0.0.1 localhost
    127.0.1.1 batcomputer

    # The following lines are desirable for IPv6 capable hosts
    ::1     ip6-localhost ip6-loopback
    fe00::0 ip6-localnet
    ff00::0 ip6-mcastprefix
    ff02::1 ip6-allnodes
    ff02::2 ip6-allrouters

--- 
apiVersion: v1 
kind: PersistentVolumeClaim 
metadata: 
  name: mysql-pvc 
  namespace: day03
spec: 
  storageClassName: standard
  accessModes: 
  - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1 
kind: Pod 
metadata:
  name: mysql 
  namespace: day03
spec:
  volumes:
  - name: db-vol 
    persistentVolumeClaim:
      claimName: mysql-pvc
  - name: data 
    hostPath: 
      path: /opt/data
      type: DirectoryOrCreate
  - name: config-data
    configMap:
      name: mysql-cm
  - name: secret-data
    secret:
      secretName: mysql-secret
  containers: 
  - name: mysql-container
    image: mysql:8 
    env:
    - name: MYSQL_ROOT_PASSWORD 
      value: changeit
    ports:
    - containerPort: 3306
    volumeMounts:
    - name: data
      mountPath: /var/data
    - name: config-data 
      mountPath: /opt/config
      readOnly: true
    - name: secret-data 
      mountPath: /opt/secret
      readOnly: true
    - name: db-vol
      mountPath: /var/lib/mysql
    resources: {}