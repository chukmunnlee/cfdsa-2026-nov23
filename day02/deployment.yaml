---
apiVersion: v1
kind: Namespace
metadata:
  name: myns
  labels:
    dept: eng
    env: dev

---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: podinfo-deploy
  namespace: myns
spec:
  replicas: 1
  selector:
    matchLabels:
      dept: eng
      env: dev
  template:
    metadata: 
      labels:
        dept: eng
        env: dev
    spec:
      containers:
      - name: podinfo-container
        image: stefanprodan/podinfo:6.17.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet: 
            path: /healthz
            port: podinfo-port
          failureThreshold: 3
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 30
        envFrom:
        - configMapRef:
            name: podinfo-cm
        - secretRef:
            name: podinfo-secret
        ports:
        - name: podinfo-port
          containerPort: 9898
        # env:
        # - name: PODINFO_UI_MESSAGE
        #   valueFrom:
        #     fieldRef:
        #       fieldPath: metadata.labels['dept']
        resources: {}
