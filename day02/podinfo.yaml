---
apiVersion: v1
kind: Namespace
metadata:
  name: myns
  labels:
    dept: eng
    env: dev

---
apiVersion: v1 
kind: Pod 
metadata: 
  name: podinfo
  namespace: myns
  labels:
    dept: eng
spec:
  containers:
  - name: podinfo-container
    image: stefanprodan/podinfo:6.17.0
    imagePullPolicy: IfNotPresent
    livenessProbe:
      httpGet: 
        path: /healthz
        port: podinfo-port
      failureThreshold: 3
      initialDelaySeconds: 5
      timeoutSeconds: 5
      periodSeconds: 30
    ports:
    - name: podinfo-port
      containerPort: 9898
