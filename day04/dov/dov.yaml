---
apiVersion: v1
kind: Namespace
metadata:
  name: day04

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dov-deploy
  namespace: day04
spec:
  replicas: 2
  selector:
    matchLabels:
      &pod-labels
      app: dov
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      containers:
      - name: dov-container
        image: chukmunnlee/dov-bear:v1
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: dov-cm
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: dov-svc 
  namespace: day04
spec:
  type: ClusterIP
  selector:
    app: dov
  ports:
  - port: 80
    targetPort: 3000
