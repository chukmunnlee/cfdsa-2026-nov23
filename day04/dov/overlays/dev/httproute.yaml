---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute 
metadata:
  name: dov-httproute 
spec:
  hostnames:
  - dov.172.25.39.201.nip.io
  parentRefs:
  - name: default-gtw 
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix 
        value: /
    backendRefs:
    - name: dov-svc 
      port: 80