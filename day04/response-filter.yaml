---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute 
metadata:
  name: api-httproute 
  namespace: day04
spec:
  hostnames:
  - api.172.25.39.200.nip.io
  parentRefs:
  - name: default-gtw 
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix 
        value: /
    backendRefs:
    - name: apiv1-svc 
      namespace: day04 
      port: 3000
    - name: apiv2-svc 
      namespace: day04 
      port: 3000
      filters:
      - type: ResponseHeaderModifier
        responseHeaderModifier:
          remove:
          - X-Powered-By

  - matches:
    - path:
        type: PathPrefix 
        value: /
      headers:
      - name: X-API-Version
        type: Exact 
        value: v2
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: Access-Control-Allow-Origin 
          value: '*'
    backendRefs:
    - name: apiv2-svc 
      namespace: day04 
      port: 3000
