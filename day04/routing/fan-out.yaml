---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute 
metadata:
  name: api-httproute 
  namespace: day04
spec:
  hostnames:
  - api.172.25.39.200.nip.io
  parentRefs:
  - name: default-gtw 
    namespace: default
    port: 80
  rules:
  - matches:
    # GET /v1/api/data -> /api/data
    - path:
        type: PathPrefix 
        value: /v1
    filters:
    - type: URLRewrite
      urlRewrite: 
        path:
          # /v1/api/data -> /api/data
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: apiv1-svc 
      namespace: day04 
      port: 3000
      weight: 3

  - matches:
    # GET /v2/api/data -> /api/data
    - path:
        type: PathPrefix 
        value: /v2
    filters:
    - type: URLRewrite
      urlRewrite: 
        path:
          # /v2/api/data -> /api/data
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: apiv2-svc 
      namespace: day04 
      port: 3000
      weight: 1
