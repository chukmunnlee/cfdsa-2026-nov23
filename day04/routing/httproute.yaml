---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute 
metadata:
  name: api-httproute 
  namespace: day04
spec:
  hostnames:
  - api.172.25.39.201.nip.io
  parentRefs:
  - name: default-gtw 
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix 
        value: /
    backendRefs:
    - name: apiv1-svc 
      namespace: day04 
      port: 3000

