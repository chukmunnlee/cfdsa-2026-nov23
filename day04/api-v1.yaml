---
apiVersion: v1
kind: Namespace
metadata:
  name: day04

--- 
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: apiv1-deploy
  namespace: day04
spec:
  replicas: 2
  strategy:
    type: Recreate
    #type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 20%
    #   maxUnavailable: 0
  selector:
    matchLabels:
      app: api
      env: dev
      version: v1
  template:
    metadata:
      labels:
        app: api
        env: dev
        version: v1
    spec:
      containers:
      - name: api-container 
        image: chukmunnlee/fake-api:v1-aug2026
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-port
          containerPort: 3000 
        - name: metric-port
          containerPort: 9464
        resources: {}

--- 
apiVersion: v1 
kind: Service
metadata:
  name: apiv1-svc
  namespace: day04
spec:
  type: ClusterIP
  #type: NodePort
  #type: LoadBalancer
  selector:
    app: api
    env: dev
    version: v1
  ports:
  - port: 3000
    targetPort: http-port

