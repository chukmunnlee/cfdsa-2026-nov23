---
apiVersion: v1
kind: Namespace
metadata:
  name: day04

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dov-deploy
  namespace: day04
spec:
  replicas: 3
  selector:
    matchLabels:
      &pod-labels
      app: dov
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      containers:
      - name: dov-container
        image: chukmunnlee/dov-bear:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: INSTANCE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: INSTANCE_HASH
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 3000
        resources: {}

---
apiVersion: v1
kind: Service
metadata:
  name: dov-svc 
  namespace: day04
spec:
  type: ClusterIP
  selector:
    app: dov
  ports:
  - port: 80
    targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: dov-hsvc 
  namespace: day04
spec:
  # do not give it an IP address
  clusterIP: None
  selector:
    app: dov
  ports:
  - port: 80
    targetPort: 3000

