---
apiVersion: v1
kind: Service
metadata:
  name: sts-dov-hsvc 
  namespace: day04
spec:
  # do not give it an IP address
  clusterIP: None
  selector:
    app: sts-dov
  ports:
  - port: 80
    targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: sts-dov-svc 
  namespace: day04
spec:
  type: ClusterIP
  selector:
    app: sts-dov
  ports:
  - port: 80
    targetPort: 3000

--- 
apiVersion: apps/v1 
kind: StatefulSet
metadata: 
  name: sts-dov 
  namespace: day04 
spec:
  #headess service name
  serviceName: sts-dov-hsvc
  replicas: 3
  selector:
    matchLabels:
      &pod-labels
      app: sts-dov
  volumeClaimTemplates:
  - metadata: 
      name: data-vol
    spec:
      storageClassName: standard 
      accessModes: [ ReadWriteOncePod ]
      resources:
        requests:
          storage: 1Gi
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      containers:
      - name: dov-container
        image: chukmunnlee/dov-bear:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: INSTANCE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: INSTANCE_HASH
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 3000
        resources: {}
        volumeMounts:
        - name: data-vol 
          mountPath: /opt/data


